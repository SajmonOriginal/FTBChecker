modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/ftbchecker/icon.png"
credits="Special thanks to the creators of the FTB mods (FTB Chunks, FTB Library, FTB Quests, and FTB Teams) for their amazing work, as well as the Minecraft Forge team for providing the tools to create this mod."
authors="${mod_authors}"

description='''
Checks for required mods on startup and shows download links for any that are missing. Pre-configured with FTB mods but can check for any mod.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
