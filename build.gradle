plugins {
    id 'org.quiltmc.loom' version '1.15.1'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-quilt"
}

repositories {
    maven { url "https://maven.quiltmc.org/repository/release/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
    runs {
        client {
            vmArgs "-Dfabric.log.level=debug"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "org.quiltmc:quilt-mappings:${quilt_mappings}:intermediary-v2"
    modImplementation "org.quiltmc:quilt-loader:${loader_version}"

    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${qfapi_version}"
    
    // QSL Base for ClientModInitializer
    modImplementation "org.quiltmc.qsl.core:qsl_base:${qsl_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "org.quiltmc.quilted-fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modImplementation "com.terraformersmc:modmenu:11.0.3"
}

processResources {
    inputs.property "version", mod_version
    inputs.property "group", mod_group_id

    filesMatching("quilt.mod.json") {
        expand "version": mod_version, "group": mod_group_id
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
